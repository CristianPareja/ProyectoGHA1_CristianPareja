name: CI GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validar-sitio:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mostrar mensaje de inicio
        run: echo "Iniciando validación del sitio web"

      - name: Verificar archivos principales
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Los archivos principales existen correctamente"

      - name: Finalizar workflow
        run: echo "Workflow ejecutado correctamente"
